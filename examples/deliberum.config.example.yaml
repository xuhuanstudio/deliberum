# Deliberum illustrative local configuration sketch.
# This file is not loaded by the current runtime. It documents conservative
# local-first defaults for future config work without enabling public hosting,
# signed URLs, provider credentials, or production deployment.

schemaVersion: 1

local:
  daemon:
    host: 127.0.0.1
    hostEnv: DELIBERUM_HOST
    port: 3877
    portEnv: DELIBERUM_PORT
    storage:
      default: sqlite
      sqlitePathEnv: DELIBERUM_DAEMON_SQLITE_PATH
      # JSON fallback can persist event/run state and safe operation audit metadata.
      # Resource access grants need SQLite for durable enforcement.
      optionalEventLedgerPathEnv: DELIBERUM_DAEMON_EVENT_STORE_PATH
      optionalRunMetadataPathEnv: DELIBERUM_DAEMON_RUN_STORE_PATH
      optionalOperationAuditPathEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_PATH
      operationAuditMaxEntriesEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_MAX_ENTRIES
      operationAuditJsonlMirror:
        pathEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_JSONL_PATH
        maxBytesEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_JSONL_MAX_BYTES
        maxFilesEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_JSONL_MAX_FILES
        material: normalized_control_plane_metadata_only
      operationAuditHttpExport:
        urlEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_EXPORT_URL
        tokenEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_EXPORT_TOKEN
        timeoutMsEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_EXPORT_TIMEOUT_MS
        allowInsecureHttpEnv: DELIBERUM_DAEMON_OPERATION_AUDIT_EXPORT_ALLOW_INSECURE_HTTP
        material: normalized_control_plane_metadata_only
        defaultRemotePolicy: https_required
      resourceBrokerState: explicit_registered_resources
      operationAuditMaterial: normalized_control_plane_metadata_only
      inMemoryFallback: true
      localSQLiteWriterSerialization: enabled
      productionMultiWriterCoordination: deferred
    auth:
      tokenEnv: DELIBERUM_DAEMON_AUTH_TOKEN
      healthEndpoint: public
      tokenScopedEndpoints:
        - webget
        - resourceAccessGet
      productionAuthorization: deferred
  cli:
    store: .deliberum/events.json
  web:
    daemonUrl: http://127.0.0.1:3877
    daemonAuthTokenEnv: VITE_DELIBERUM_DAEMON_AUTH_TOKEN
    daemonServedAssets:
      distPathEnv: DELIBERUM_DAEMON_WEB_ASSETS_PATH
      routeMode: accept_header_html_shell_json_api_split
      shellCache: no_store
      assetCache: immutable
      productionPublicHosting: deferred
  container:
    dockerfile: Dockerfile
    composeFile: compose.yaml
    listenHostInsideContainer: 0.0.0.0
    publishedHostDefault: 127.0.0.1
    dataVolumePath: /data
    imageSecretPolicy: runtime_env_only
    productionDeployment: deferred
  adaptiveProcess:
    suggestionEndpoint: read_only
    persistentProposalLifecycle: implemented
    acceptedProposalExecution: explicit_operator_control
    automatedPrimitiveExecutionPolicy: deferred
  resourceDelivery:
    planningEndpoint: session_scoped
    safeLedgerAuditEvents: implemented

adapters:
  manual:
    enabled: true
  fake:
    enabled: true
  openaiCompatible:
    enabled: false
    daemonEnvProfile:
      profile: DELIBERUM_ENABLE_OPENAI_COMPATIBLE_PROFILE
      extraction: DELIBERUM_ENABLE_OPENAI_COMPATIBLE_EXTRACTION
      review: DELIBERUM_ENABLE_OPENAI_COMPATIBLE_REVIEW
      finalization: DELIBERUM_ENABLE_OPENAI_COMPATIBLE_FINALIZATION
      apiKeyEnvVar: DELIBERUM_OPENAI_API_KEY
    note: Use the daemon env profile for local/pre-production provider-backed runs. Do not commit API keys.
  httpTemplate:
    enabled: false
    daemonEnvProfile:
      profile: DELIBERUM_ENABLE_HTTP_TEMPLATE_PROFILE
      apiKeyEnvVar: DELIBERUM_HTTP_TEMPLATE_API_KEY
      headersJson: DELIBERUM_HTTP_TEMPLATE_HEADERS_JSON
      bodyTemplate: DELIBERUM_HTTP_TEMPLATE_BODY
      responseFormat: DELIBERUM_HTTP_TEMPLATE_RESPONSE_FORMAT
      responsePayloadPath: DELIBERUM_HTTP_TEMPLATE_RESPONSE_PAYLOAD_PATH
    runPlanProviderConfig:
      runtimeVariables: httpTemplate.variables
      runtimeVariablesSecretPolicy: non_secret_only
    secretMode: runtime_placeholders
    note: Use the opt-in daemon env profile for sealed participant execution. Use template placeholders such as "{{runtime.apiKey}}"; do not commit inline provider secrets.
  mcpTool:
    enabled: false
    daemonEnvProfile:
      profile: DELIBERUM_ENABLE_MCP_TOOL_PROFILE
      endpointUrl: DELIBERUM_MCP_TOOL_URL
      toolName: DELIBERUM_MCP_TOOL_NAME
      authTokenEnvVar: DELIBERUM_MCP_TOOL_AUTH_TOKEN
      timeoutMs: DELIBERUM_MCP_TOOL_TIMEOUT_MS
      allowRemote: DELIBERUM_MCP_TOOL_ALLOW_REMOTE
      verifyList: DELIBERUM_MCP_TOOL_VERIFY_LIST
      maxArgumentBytes: DELIBERUM_MCP_TOOL_MAX_ARGUMENT_BYTES
      allowedArgumentKeys: DELIBERUM_MCP_TOOL_ALLOWED_ARGUMENT_KEYS
      includeContext: DELIBERUM_MCP_TOOL_INCLUDE_CONTEXT
    defaultNetworkPolicy: local_loopback_only
    remoteNetworkPolicy: explicit_https_only
    executionPolicy: optional_argument_size_key_allowlist_and_context_forwarding_controls
    serverLifecycle: external
    secretMode: daemon_runtime_only
    note: Use the opt-in daemon env profile for one configured MCP-compatible tool endpoint. The daemon does not start MCP servers, expose arbitrary tools, or provide a production sandbox.
  webget:
    enabled: true
    experimental: true
    tokenScope: daemon_local

resources:
  defaultDeliveryMode: none
  sensitiveDefault: none
  accessBaseUrlEnv: DELIBERUM_RESOURCE_ACCESS_BASE_URL
  accessAllowRemoteEnv: DELIBERUM_RESOURCE_ACCESS_ALLOW_REMOTE
  accessTtlMsEnv: DELIBERUM_RESOURCE_ACCESS_TTL_MS
  remoteAccessBaseUrl: explicit_opt_in_only
  publicAccessBaseUrl: https_only
  postureEndpoint: /runtime/resource-access
  hostedContentPreconditions: explicit_policy_and_size_limit
  publicUrlHosting: deferred
  signedUrls: deferred
  notes:
    - Resource Broker and Delivery Planner exist as support packages.
    - The current runtime has daemon-local session-scoped resource delivery planning with safe ledger audit events.
    - The current runtime does not host public resources or generate public URLs.
    - Sensitive resources must not be exposed by default.

deferred:
  productionMultiWriterCoordination: true
  productionResourceHosting: true
  productionAuthorization: true
  signedUrlServer: true
  automatedPrimitiveExecutionPolicy: true
  providerSetupUx: true
  mcpServerLifecycle: true
  mcpToolSandboxing: true
  productionAuth: true
