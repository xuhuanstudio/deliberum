# Deliberum illustrative local configuration sketch.
# This file is not loaded by the current runtime. It documents conservative
# local-first defaults for future config work without enabling public hosting,
# signed URLs, provider credentials, or production deployment.

schemaVersion: 1

local:
  daemon:
    host: 127.0.0.1
    port: 3877
    storage: in_memory
  cli:
    store: .deliberum/events.json
  web:
    daemonUrl: http://127.0.0.1:3877

adapters:
  manual:
    enabled: true
  fake:
    enabled: true
  openaiCompatible:
    enabled: false
    note: Configure programmatically in tests or local code. Do not commit API keys.
  webget:
    enabled: true
    experimental: true
    tokenScope: daemon_local

resources:
  defaultDeliveryMode: none
  sensitiveDefault: none
  publicUrlHosting: deferred
  signedUrls: deferred
  notes:
    - Resource Broker and Delivery Planner exist as support packages.
    - The current runtime does not host resources or generate public URLs.
    - Sensitive resources must not be exposed by default.

deferred:
  daemonPersistentStorage: sqlite_or_equivalent
  daemonFinalEndpoints: true
  daemonResourceEndpoints: true
  publicResourceHosting: true
  signedUrlServer: true
  productionAuth: true
