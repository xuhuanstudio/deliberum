name: Container Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    name: Container runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Verify container runtime path
        run: pnpm run smoke:container
