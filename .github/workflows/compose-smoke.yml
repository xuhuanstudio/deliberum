name: Compose Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: true

      - name: Verify Compose runtime path
        run: pnpm run smoke:compose
